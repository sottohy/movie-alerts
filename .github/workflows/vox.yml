name: VOX booking alerts

on:
  schedule:

    # Full horror/movie scan every 3 hours
    - cron: "17 */3 * * *"

    # Doomsday high-priority monitoring:
    # every 5 minutes during October–December
    - cron: "2-59/5 * * 11-12 *"

  # Allow manual runs from GitHub
  workflow_dispatch:


# Needed to push state.json back to the repository
permissions:
  contents: write


# Prevent simultaneous runs from racing on state.json
concurrency:
  group: vox-alerts
  cancel-in-progress: false


jobs:
  check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip


      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Determine run mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && {
            [ "$(date -u +%-m)" = "11" ] || [ "$(date -u +%-m)" = "12" ];
          }; then
            echo "RUN_MODE=doomsday" >> "$GITHUB_ENV"
          else
            echo "RUN_MODE=full" >> "$GITHUB_ENV"
          fi


      - name: Run alerter
        env:
          NTFY_HORROR_TOPIC: ${{ secrets.NTFY_HORROR_TOPIC }}
          NTFY_DOOMSDAY_TOPIC: ${{ secrets.NTFY_DOOMSDAY_TOPIC }}
          NTFY_ERROR_TOPIC: ${{ secrets.NTFY_ERROR_TOPIC }}
        run: python vox_notify.py


      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update VOX film state [skip ci]"
            git push
          fi